name: CI (lint + build)

# Basic CI gate: runs on every push and PR so a broken build or lint
# failure surfaces in GitHub itself, not just when someone happens to
# run `npm run build` locally before pushing. Doesn't deploy anything --
# Vercel handles actual deployment on push to main independently of this.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build
