name: CI (lint + build + smoke tests)

# Basic CI gate: runs on every push and PR so a broken build, lint
# failure, or smoke-test failure surfaces in GitHub itself, not just
# when someone happens to run things locally before pushing. Doesn't
# deploy anything -- Vercel handles actual deployment on push to main
# independently of this.
#
# Two separate jobs rather than one: lint+build is fast and should
# gate quickly; smoke-tests needs a real Chromium install (~1-2 min)
# and a full production build+start under the hood (playwright.config.js's
# webServer), so it's slower and kept separate rather than blocking the
# faster feedback loop of the first job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
